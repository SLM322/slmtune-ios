# SLMtune for iOS on GitHub's macOS machines: no Mac of your own needed.
#
# Every push / pull request:  cores (Libbox.xcframework) → XcodeGen → build all targets and run the tests on the
#                             iOS simulator. Nothing is signed; no secrets needed.
# Run manually with "ipa" on:       a development-signed IPA for the iPhones registered in your account (Devices),
#                             published as a GitHub release with an install link (docs/GITHUB.md).
# Run manually ("Run workflow") with "testflight" on: the same, then an App Store build signed by Xcode's automatic
#                             signing with an App Store Connect API key, uploaded to TestFlight — install it on the
#                             iPhone with the TestFlight app. Secrets and variables: see docs/GITHUB.md.
name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ipa:
        description: "Собрать IPA для своего iPhone (профиль разработчика)"
        type: boolean
        default: false
      testflight:
        description: "Подписать и загрузить в TestFlight"
        type: boolean
        default: false
      trusttunnel:
        description: "Собрать TrustTunnel (C++, +20–30 минут)"
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Tor.framework package needs Swift 6.3+ (Xcode 27).
  XCODE_VERSION: latest-stable

jobs:
  cores:
    name: Cores (sing-box + Xray + mihomo + Tor transports, TrustTunnel)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Cache Libbox.xcframework
        id: libbox-cache
        uses: actions/cache@v4
        with:
          path: Frameworks/Libbox.xcframework
          key: libbox-${{ hashFiles('core/go.mod', 'core/go.sum', 'core/*.go', 'scripts/build-libbox.sh') }}

      - uses: actions/setup-go@v5
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Build Libbox.xcframework
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-libbox.sh

      - name: Cache VpnClientFramework.xcframework (TrustTunnel)
        id: tt-cache
        if: inputs.trusttunnel
        uses: actions/cache@v4
        with:
          path: Frameworks/VpnClientFramework.xcframework
          key: trusttunnel-${{ hashFiles('TrustTunnelBridge/*', 'scripts/build-trusttunnel.sh') }}

      - name: Build TrustTunnel
        if: inputs.trusttunnel && steps.tt-cache.outputs.cache-hit != 'true'
        run: |
          brew install cmake conan cocoapods
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          bash scripts/build-trusttunnel.sh

      - uses: actions/upload-artifact@v4
        with:
          name: frameworks
          path: Frameworks/*.xcframework
          retention-days: 7

  build-test:
    name: Build and test (simulator)
    needs: cores
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: frameworks
          path: Frameworks

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          if [ -d Frameworks/VpnClientFramework.xcframework ]; then cp Config/trusttunnel.yml Config/optional.yml; fi
          xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          ID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Build every target and run the tests
        run: |
          xcodebuild test \
            -project SLMtune.xcodeproj -scheme SLMtune \
            -destination "id=${{ steps.sim.outputs.id }}" \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            > build.log 2>&1 || { grep -E "error:" build.log | sort -u | head -100; tail -40 build.log; exit 1; }
          grep -E "Executed [0-9]+ tests" build.log | tail -1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          retention-days: 7

  unsigned-ipa:
    name: Unsigned IPA (sign it yourself)
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write # the rolling "unsigned" release
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: frameworks
          path: Frameworks

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          if [ -d Frameworks/VpnClientFramework.xcframework ]; then cp Config/trusttunnel.yml Config/optional.yml; fi
          xcodegen generate

      - name: Build for iPhone without signing
        run: |
          xcodebuild archive \
            -project SLMtune.xcodeproj -scheme SLMtune -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/SLMtune.xcarchive \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            > archive.log 2>&1 || { grep -E "error:" archive.log | sort -u | head -60; tail -40 archive.log; exit 1; }
          mkdir -p build/ipa/Payload
          cp -R build/SLMtune.xcarchive/Products/Applications/SLMtune.app build/ipa/Payload/
          # The entitlements a re-signer should keep (it takes the rest from your provisioning profile).
          cp PacketTunnel/PacketTunnel.entitlements build/PacketTunnel.entitlements
          cp App/SLMtune.entitlements build/SLMtune.entitlements
          (cd build/ipa && zip -qry ../SLMtune-unsigned.ipa Payload)
          ls -la build/SLMtune-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: SLMtune-unsigned-ipa
          path: build/SLMtune-unsigned.ipa
          retention-days: 30

      - name: Publish as the "unsigned" release
        run: |
          gh release delete unsigned --yes --cleanup-tag 2>/dev/null || true
          printf '%s\n\n%s\n' \
            "Неподписанная сборка с последнего коммита ($(git rev-parse --short HEAD), сборка ${{ github.run_number }})." \
            "Подпишите своим сертификатом (ESign, Feather, Scarlet, zsign). VPN работает, только если в профиле подписи есть разрешение Network Extension (packet-tunnel-provider) — см. docs/GITHUB.md." > notes.md
          gh release create unsigned build/SLMtune-unsigned.ipa build/SLMtune.entitlements build/PacketTunnel.entitlements \
            --title "SLMtune (unsigned, build ${{ github.run_number }})" --notes-file notes.md --prerelease --target "$GITHUB_SHA"

  # The Go side as an iOS program: every package's init runs, then libbox.Setup. A panic here is what kills the
  # extension on the phone at launch, and here its text is visible.
  go-init:
    name: Go cores start as an iOS binary (simulator)
    runs-on: macos-15-intel  # x86 pool: the arm64 macOS runners are short of capacity
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Build and run on the simulator
        run: |
          set -o pipefail
          cd core
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          TAGS=$(grep -o '^TAGS="[^$"]*' ../scripts/build-libbox.sh | head -1 | cut -d'"' -f2),with_dhcp,grpcnotrace,with_low_memory,slm_bind,iossimulator
          if [ "$(uname -m)" = "arm64" ]; then export GOARCH=arm64; T=arm64-apple-ios17.0-simulator; else export GOARCH=amd64; T=x86_64-apple-ios17.0-simulator; TAGS=${TAGS/with_naive_outbound,/}; fi  # cronet's x86 simulator library doesn't link
          export CGO_ENABLED=1 GOOS=ios
          export CC="$(xcrun --sdk iphonesimulator -f clang) -target $T -isysroot $SDK"
          export CGO_CFLAGS="-target $T -isysroot $SDK" CGO_LDFLAGS="-target $T -isysroot $SDK"
          for variant in full lite; do
            go build -trimpath -tags "$TAGS" -ldflags "-checklinkname=0 -s -w" -o "/tmp/init-$variant" "./internal/inittest/$variant"
            ls -la "/tmp/init-$variant"
          done
          ID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$ID" || true
          xcrun simctl bootstatus "$ID" -b
          status=0
          for variant in lite full; do
            echo "::group::$variant"
            xcrun simctl spawn "$ID" "/tmp/init-$variant" 2>&1 | tail -80 || { echo "FAILED: $variant"; status=1; }
            echo "::endgroup::"
          done
          exit $status

  # sing-box alone, without Xray / mihomo / Tor: a much smaller VPN extension (iOS kills one above ~50 MB).
  lite-ipa:
    name: Unsigned lite IPA (sing-box only)
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Cache the lite Libbox.xcframework
        id: libbox-cache
        uses: actions/cache@v4
        with:
          path: Frameworks/Libbox.xcframework
          key: libbox-lite-${{ hashFiles('core/go.mod', 'core/go.sum', 'scripts/build-libbox.sh') }}

      - uses: actions/setup-go@v5
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Build Libbox.xcframework (sing-box only, device)
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        run: LITE=1 PLATFORMS=ios bash scripts/build-libbox.sh

      - name: Generate the Xcode project without Tor
        run: |
          brew install xcodegen
          python3 - <<'EOF'
          import re
          p = open('project.yml').read()
          p2 = p.replace("      - package: TorFramework\n        product: CTor\n", "")
          assert p2 != p
          open('project.yml', 'w').write(p2)
          EOF
          xcodegen generate

      - name: Build for iPhone without signing
        run: |
          xcodebuild archive \
            -project SLMtune.xcodeproj -scheme SLMtune -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/SLMtune.xcarchive \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) SLM_LITE' \
            > archive.log 2>&1 || { grep -E "error:" archive.log | sort -u | head -60; tail -40 archive.log; exit 1; }
          mkdir -p build/ipa/Payload
          cp -R build/SLMtune.xcarchive/Products/Applications/SLMtune.app build/ipa/Payload/
          ls -la build/ipa/Payload/SLMtune.app/PlugIns/PacketTunnel.appex/PacketTunnel
          (cd build/ipa && zip -qry ../SLMtune-lite-unsigned.ipa Payload)
          ls -la build/SLMtune-lite-unsigned.ipa

      - name: Publish as the "unsigned-lite" release
        run: |
          gh release delete unsigned-lite --yes --cleanup-tag 2>/dev/null || true
          printf '%s\n' "Облегчённая неподписанная сборка ($(git rev-parse --short HEAD), сборка ${{ github.run_number }}): только sing-box, без Xray, mihomo, TrustTunnel и Tor. Расширение VPN в несколько раз меньше." > notes.md
          gh release create unsigned-lite build/SLMtune-lite-unsigned.ipa \
            --title "SLMtune lite (unsigned, build ${{ github.run_number }})" --notes-file notes.md --prerelease --target "$GITHUB_SHA"

  testflight:
    name: Sign and upload to TestFlight
    needs: build-test
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TEAM_ID: ${{ vars.TEAM_ID }}
      BUNDLE_PREFIX: ${{ vars.BUNDLE_PREFIX }}
      APP_GROUP: ${{ vars.APP_GROUP }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: frameworks
          path: Frameworks

      - name: Check the settings
        run: |
          for v in TEAM_ID BUNDLE_PREFIX APP_GROUP ASC_KEY_ID ASC_ISSUER_ID; do
            [ -n "${!v}" ] || { echo "::error::Не задано $v — см. docs/GITHUB.md"; exit 1; }
          done

      - name: App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY=~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY"
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          if [ -d Frameworks/VpnClientFramework.xcframework ]; then cp Config/trusttunnel.yml Config/optional.yml; fi
          xcodegen generate

      - name: Archive (automatic signing with the API key)
        run: |
          xcodebuild archive \
            -project SLMtune.xcodeproj -scheme SLMtune -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/SLMtune.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -skipPackagePluginValidation -skipMacroValidation \
            DEVELOPMENT_TEAM="$TEAM_ID" BUNDLE_PREFIX="$BUNDLE_PREFIX" APP_GROUP="$APP_GROUP" \
            CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            > archive.log 2>&1 || { grep -E "error:" archive.log | sort -u | head -60; tail -40 archive.log; exit 1; }

      - name: Upload to TestFlight
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/SLMtune.xcarchive -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Сборка ${{ github.run_number }} загружена: через 5–15 минут она появится в TestFlight."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archive-log
          path: archive.log
          retention-days: 7

      - name: Remove the key
        if: always()
        run: rm -rf ~/.appstoreconnect

  ipa:
    name: IPA for your iPhone (development signing)
    needs: build-test
    if: github.event_name == 'workflow_dispatch' && inputs.ipa
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write # the GitHub release with the IPA
    env:
      TEAM_ID: ${{ vars.TEAM_ID }}
      BUNDLE_PREFIX: ${{ vars.BUNDLE_PREFIX }}
      APP_GROUP: ${{ vars.APP_GROUP }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: frameworks
          path: Frameworks

      - name: Check the settings
        run: |
          for v in TEAM_ID BUNDLE_PREFIX APP_GROUP ASC_KEY_ID ASC_ISSUER_ID; do
            [ -n "${!v}" ] || { echo "::error::Не задано $v — см. docs/GITHUB.md"; exit 1; }
          done

      - name: App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY=~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY"
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          if [ -d Frameworks/VpnClientFramework.xcframework ]; then cp Config/trusttunnel.yml Config/optional.yml; fi
          xcodegen generate

      - name: Archive (development signing; profiles cover the devices registered in the account)
        run: |
          xcodebuild archive \
            -project SLMtune.xcodeproj -scheme SLMtune -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/SLMtune.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -skipPackagePluginValidation -skipMacroValidation \
            DEVELOPMENT_TEAM="$TEAM_ID" BUNDLE_PREFIX="$BUNDLE_PREFIX" APP_GROUP="$APP_GROUP" \
            CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            > archive.log 2>&1 || { grep -E "error:" archive.log | sort -u | head -60; tail -40 archive.log; exit 1; }

      - name: Export the IPA
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>debugging</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/SLMtune.xcarchive -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > export.log 2>&1 || { grep -E "error" export.log | head -40; tail -30 export.log; exit 1; }
          mv build/export/*.ipa build/SLMtune.ipa
          ls -la build/SLMtune.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: SLMtune-ipa
          path: build/SLMtune.ipa
          retention-days: 30

      - name: Release with an install link
        run: |
          TAG="dev-${{ github.run_number }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :ApplicationProperties:CFBundleShortVersionString" build/SLMtune.xcarchive/Info.plist)
          # Over-the-air install manifest (itms-services): works for development-signed apps on registered iPhones.
          cat > build/manifest.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>items</key><array><dict>
            <key>assets</key><array><dict>
              <key>kind</key><string>software-package</string>
              <key>url</key><string>$BASE/SLMtune.ipa</string>
            </dict></array>
            <key>metadata</key><dict>
              <key>bundle-identifier</key><string>$BUNDLE_PREFIX</string>
              <key>bundle-version</key><string>$VERSION</string>
              <key>kind</key><string>software</string>
              <key>title</key><string>SLMtune</string>
            </dict>
          </dict></array></dict></plist>
          EOF
          LINK="itms-services://?action=download-manifest&url=$BASE/manifest.plist"
          printf '%s\n\n%s\n\n    %s\n\n%s\n' \
            "Сборка для iPhone, зарегистрированных в аккаунте разработчика (Devices). Подпись действует год." \
            "Установка с iPhone: скопируйте строку ниже, вставьте в адресную строку Safari, «Перейти» → «Установить»:" \
            "$LINK" \
            "Или скачайте SLMtune.ipa и поставьте по кабелю (docs/GITHUB.md)." > notes.md
          gh release create "$TAG" build/SLMtune.ipa build/manifest.plist \
            --title "SLMtune $VERSION ($TAG)" --notes-file notes.md --prerelease
          printf '### IPA готов: %s\n\nСсылка для Safari на iPhone:\n\n    %s\n' "$TAG" "$LINK" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipa-logs
          path: |
            archive.log
            export.log
          retention-days: 7

      - name: Remove the key
        if: always()
        run: rm -rf ~/.appstoreconnect
